name: CI

on: [push, pull_request]

jobs:
  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install modules
        run: npm install
      - name: Lint
        run: npx eslint extension/gnome-shell-cast@oxygenws.com eslint.config.mjs
      - name: Format check
        run: npx prettier --check extension/ eslint.config.mjs

  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Format
        run: cd daemon && cargo fmt --check
      - name: Clippy
        run: cd daemon && cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cd daemon && cargo build
      - name: Test
        run: cd daemon && cargo test

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Flake check
        run: nix flake check
      - name: Build
        run: nix build .#default .#daemon .#extension
      - name: Verify the D-Bus service points at the wrapped binary
        run: |
          cat result/share/dbus-1/services/org.gnome.ShellCast.service
          grep -q '^Exec=/nix/store/.*/bin/gnome-shell-cast-daemon$' \
            result/share/dbus-1/services/org.gnome.ShellCast.service
          test -f result/share/gnome-shell/extensions/gnome-shell-cast@oxygenws.com/schemas/gschemas.compiled
          test ! -d result/share/gnome-shell/extensions/gnome-shell-cast@oxygenws.com/po
